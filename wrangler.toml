# Cloudflare Pages（Git 部署）
#
# KV 不要在仓库里写 Namespace ID，否则占位符会导致部署报错：
# Invalid KV namespace ID ... Not a valid hex string
#
# 正确做法：在 Cloudflare Dashboard → 你的 Pages 项目 → Settings → Functions
# → KV namespace bindings → Variable name = PUNCH_KV → 选择已创建的 Namespace
#
# 本地 wrangler pages dev 需要 KV 时，用命令行传入（把下面 ID 换成你的）：
#   npx wrangler pages dev dist --kv=PUNCH_KV=你的NamespaceID

name = "project-recording"
compatibility_date = "2024-12-30"
pages_build_output_dir = "./dist"

# 可选：允许的浏览器 Origin（也可在 Pages → Environment variables 配置 ALLOWED_ORIGIN）
# [vars]
# ALLOWED_ORIGIN = "https://your-project.pages.dev,https://example.com"
