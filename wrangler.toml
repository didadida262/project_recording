# Cloudflare Pages：Git 部署会读取本文件。
#
# 若 Dashboard 提示「Bindings are managed through wrangler.toml」，
# 则必须在下面配置 KV，控制台里无法再加 Bindings（与旧文档「只在 Dashboard 绑」二选一，以你账号实际为准）。
#
# Namespace ID：Workers KV → 点开你的 Namespace → Instance Detail → Namespace ID（32 位十六进制）

name = "project-recording"
compatibility_date = "2024-12-30"
pages_build_output_dir = "./dist"

[[kv_namespaces]]
binding = "PUNCH_KV"
# 在 Cloudflare 控制台复制你的 Namespace ID 替换下面这一行（勿使用假占位符）
id = "dde600c7e6fa4298aa7df2e1a43a0211"

# 可选：允许的浏览器 Origin
# [vars]
# ALLOWED_ORIGIN = "https://www.mileswang262.com,https://mileswang262.com"
